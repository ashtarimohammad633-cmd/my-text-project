<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/home.css" />
        <link rel="stylesheet" href="./styles/details.css" />



        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <title> نمونه </title>
    </head>
    <body>

        <!-- header -->
        <header>
            <div class="header-container">
                <a href="home.html" class="logo-container">
                    <img class="logo" src="assets/images/images.jfif">
                </a>

                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input
                        class="search"
                        id="search"
                        placeholder="جستجوی کتاب ..."
                        onkeydown="handleSearch(event)" />
                </div>

                <div class="">
                     <div class="nav-links" >
                    <ul class="nav-links" id="menu">
                    </ul>
                    <div class="cart-icon" id="cartIcon">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-count">0</span>
                    </div>
                </div>

                <div class="hamburger" id="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </header>

        <!-- menu mobile  -->
        <div class="mobile-nav" id="mobileNav">
            <div class="mobile-nav-header">
                <a href="home.html" class="logo-container">
                    <img class="logo" src="./assets/images/images.jfif">
                </a>
                <div class="close-menu" id="closeMenu">
                    <i class="fas fa-times"></i>
                </div>
            </div>

            <div class="mobile-nav-links">
                <a href="index.html">خانه</a>
                <a href="pages/about.html">درباره</a>
                <a href="pages/contact.html">تماس با ما</a>
                <a href="#" id="mobileCartBtn"> سبد خرید </a>
                
            </div>
        </div>

        <div class="overlay" id="overlay"></div>
        <!-- shopping cart menu -->
        <div class="cart-sidebar" id="cartSidebar">
            <!-- header سبد خرید -->
            <div class="cart-header">
                <h3>سبد خرید شما</h3>
                <div class="close-cart" id="closeCart">
                    <i class="fas fa-times"></i>
                </div>
            </div>

            <!-- لیست آیتم‌ها -->
            <div class="cart-items" id="cartItems">
                <div class="empty-cart">
                    <p>سبد خرید شما خالی است</p>
                </div>
            </div>

            <!-- مجموع و دکمه تکمیل خرید -->
            <div class="cart-total">
                مجموع : <span id="cartTotal">0 تومان</span>
                <div class="checkout-btn-container">
                    <button class="checkout-btn">تکمیل خرید</button>
                </div>
            </div>
        </div>

        <!--menu section-->
        <div class="mobile-nav" id="mobileNav">
            <div class="mobile-nav-header">
                <a href="home.html" class="logo-container">
                    <img src="./assets/images/logo.png" class="logo"
                        alt="farnod-book" />
                </a>
                <div class="close-menu" id="closeMenu">
                    <i class="fas fa-times"></i>
                </div>
            </div>

            <div class="mobile-nav-links">
                <a href="pages/">خانه</a>
                <a href="pages/">درباره</a>
                <a href="pages/">تماس با ما</a>
            </div>

        </div>
        <div class="overlay" id="overlay"></div>

      

        <!--hero-section-->

        <section class="hero">
            <div class="hero-container">
                <div class="hero-right"></div>
                <div class="hero-content">
                    <h3> بهترین قهوه </h3>
                    <p> قهوه های کوبا و کلمبیا</p>
                    <button>ثبت نام</button>
                </div>
            </div>

        </section>

        <!--categories-section-->

        <section class="children">
            <h2 class="title-section">  محصولات </h2>
            <div class="slider-wrapper">
                <button class="btn btn-prev" id="prevBtn" disabled>‹</button>
                <div class="slider-container" id="slider">
                    <!-- کارت‌ها با JS ساخته می‌شوند -->
                </div>
                <button class="btn btn-next" id="nextBtn">›</button>
            </div>
        </section>

        <!--auido books section-->
        <section class="hot-books-section">
            <h2 class="title-section">محبوب ترین  محصولات</h2>
            <div class="books-grid" id="hotBooksGrid">
                <!-- کتاب‌ها اینجا رندر می‌شوند -->
            </div>
        </section>

        <!-- banner section-->
       

        <!--footer section -->
      
           

        <!--footer section -->
        <div id="footer">
            <div class="footer">
                <section class="footer_item">
                    <h4 class="footer_title">درباره ما</h4>
                    <p>این یک نمونه کار ساده و معمولی است و </p>
                </section>
                <section class="footer_item">
                    <h4 class="footer_title">مجوزها</h4>
                    <img src="../assets/images/enamad_icon.png" alt="">
                </section>
                <section class="footer_item">
                    <h4 class="footer_title">ارتباط با ما</h4>
                    <a href="">تماس : 09111111111</a>
                    <a href="">پست الکترونیک: edu@faradars.org</a>
                </section>
            </div>

        <script src="./js/app.js"></script>
        <script src="details.js"></script>
        <script src="./js/search.js"></script>
        <script src="./js/menu.js"></script>

    </body>
</html>
